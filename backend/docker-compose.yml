version: '3.8'

services:
  machinasense-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: machinasense-backend
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
      - DEFAULT_SAMPLE_RATE_HZ=10.0
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 3s
      retries: 3
